<header class="bg-gray-900 py-3 flex items-center border-b border-gray-700 px-4">
  <a routerLink="/">
    <img src="favicon.ico" class="w-10" />
  </a>

  <div class="ml-auto flex items-center gap-3">
    @if (user.isLoggedIn()) {
    <button (click)="deleteAccount()" class="text-red-400 hover:text-red-300 text-sm font-semibold transition-all">
      Borrar cuenta
    </button>
    <button (click)="logout()"
      class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">
      Cerrar sesión
    </button>
    } @else {
    <button (click)="goToAuth()" class="w-9 h-9 rounded-full bg-gray-600 hover:bg-gray-500 flex items-center justify-center transition-all cursor-pointer">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
  </svg>
</button>
    }

    <a routerLink="/notifications">
      <img src="notification.png" class="w-7" />
    </a>
  </div>
</header>
