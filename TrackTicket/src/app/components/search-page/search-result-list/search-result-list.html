<div class="flex flex-col gap-3 p-2">
  @for (concert of concertSearch.concerts(); track concert.idTicketMaster) {
    <div
      class="cursor-pointer rounded-[24px] border border-white/10 bg-black/20 p-4 text-white shadow-xl backdrop-blur-sm transition hover:border-[#9d7c60]"
      (click)="listClick(concert)"
    >
      <div class="mb-3">
        <h2 class="text-xl font-black leading-tight">
          {{ concert.name }}
        </h2>
      </div>

      <div class="space-y-2 text-sm">
        <div class="rounded-xl bg-white/5 px-3 py-2">
          <span class="text-[#9d7c60]">Artista:</span>
          {{ concert.artistName }}
        </div>

        <div class="rounded-xl bg-white/5 px-3 py-2">
          <span class="text-[#9d7c60]">Fecha:</span>
          {{ concert.date }}
        </div>

        <div class="rounded-xl bg-white/5 px-3 py-2">
          <span class="text-[#9d7c60]">Recinto:</span>
          {{ concert.venue.venueName }}
        </div>

        <div class="rounded-xl bg-white/5 px-3 py-2">
          <span class="text-[#9d7c60]">Direccion:</span>
          {{ concert.venue.venueAddress }}
        </div>
      </div>

      <div class="mt-4 flex justify-end">
        <a
          [href]="concert.link"
          target="_blank"
          class="rounded-full bg-[#9d7c60] px-4 py-2 text-[10px] font-bold uppercase tracking-[0.18em] text-white transition hover:brightness-110"
        >
          Ver concierto
        </a>
      </div>
    </div>
  }
</div>
