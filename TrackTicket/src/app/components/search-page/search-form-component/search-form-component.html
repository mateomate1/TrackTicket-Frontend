<form
  (ngSubmit)="searchConcerts()"
  class="grid grid-cols-6 items-end gap-4 rounded-[30px] border border-white/10 bg-black/20 p-5 text-white shadow-2xl backdrop-blur-sm"
>
  <div>
    <label class="mb-2 block text-[10px] font-semibold uppercase tracking-[0.28em] text-[#9d7c60]">
      Inicio
    </label>

    <input
      type="date"
      name="startDate"
      [ngModel]="startDate()"
      (ngModelChange)="startDate.set($event)"
      class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white outline-none transition focus:border-[#9d7c60] focus:bg-white/10"
    />
  </div>

  <div>
    <label class="mb-2 block text-[10px] font-semibold uppercase tracking-[0.28em] text-[#9d7c60]">
      Fin
    </label>

    <input
      type="date"
      name="endDate"
      [ngModel]="endDate()"
      (ngModelChange)="endDate.set($event)"
      class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white outline-none transition focus:border-[#9d7c60] focus:bg-white/10"
    />
  </div>

  <div>
    <label class="mb-2 block text-[10px] font-semibold uppercase tracking-[0.28em] text-[#9d7c60]">
      Artista
    </label>

    <input
      type="text"
      name="artist"
      [ngModel]="artist()"
      (ngModelChange)="artist.set($event)"
      placeholder="Artista"
      class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white placeholder:text-gray-400 outline-none transition focus:border-[#9d7c60] focus:bg-white/10"
    />
  </div>

  <div>
    <label class="mb-2 block text-[10px] font-semibold uppercase tracking-[0.28em] text-[#9d7c60]">
      Ubicacion
    </label>

    <input
      type="text"
      name="location"
      [ngModel]="location()"
      (ngModelChange)="location.set($event)"
      placeholder="Ciudad"
      class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white placeholder:text-gray-400 outline-none transition focus:border-[#9d7c60] focus:bg-white/10"
    />
  </div>

  <button
    type="reset"
    class="rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-semibold uppercase tracking-[0.18em] transition hover:bg-white hover:text-black"
  >
    Limpiar
  </button>

  <button
    type="submit"
    class="rounded-2xl bg-[#9d7c60] px-4 py-2 text-sm font-semibold uppercase tracking-[0.18em] text-white transition hover:brightness-110"
  >
    Buscar
  </button>
</form>
