<form (ngSubmit)="onSubmit()">

  <div class="mb-4">
    <label class="block text-gray-400 text-sm mb-1">Usuario</label>
    <input
      type="text"
      [ngModel]="userName()"
      (ngModelChange)="userName.set($event)"
      name="userName"
      placeholder="Tu nombre de usuario"
      class="w-full bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
    />
  </div>

  <div class="mb-6">
    <label class="block text-gray-400 text-sm mb-1">Contraseña</label>
    <input
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
      placeholder="Tu contraseña"
      class="w-full bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
    />
  </div>

  @if (error()) {
    <p class="text-red-400 text-sm mb-4">{{ error() }}</p>
  }

  <button
    type="submit"
    [disabled]="loading()"
    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 rounded-lg transition-all disabled:opacity-50">
    {{ loading() ? 'Entrando...' : 'Entrar' }}
  </button>

</form>
